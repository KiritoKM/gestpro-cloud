# ─────────────────────────────────────────────────────────────
# GestPro Cloud — API Gateway y balanceador de carga (L7)
#  - Una sola entrada (puerto 8080) para toda la plataforma
#  - ACLs por ruta /api/<servicio> -> backend del microservicio
#  - Validación del JWT (HS256) en el gateway, no en cada servicio
#  - Round-robin entre réplicas descubiertas por el DNS de Swarm
#  - Health checks: una réplica caída sale del balanceo sola
# ─────────────────────────────────────────────────────────────
global
    log stdout format raw local0
    maxconn 2000

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client  60s
    timeout server  60s

# DNS interno de Docker: tasks.<servicio> devuelve la IP de CADA réplica
resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      5s
    hold nx         5s
    hold obsolete   5s

frontend gestpro
    bind *:8080

    # Nunca confiar en cabeceras de identidad que mande el cliente
    http-request del-header X-User-Id
    http-request del-header X-User-Name
    http-request del-header X-User-Role

    acl is_api        path_beg /api/
    acl is_login      path /api/auth/login
    acl is_auth       path_beg /api/auth/
    acl is_inventory  path_beg /api/inventory/
    acl is_sales      path_beg /api/sales
    acl is_cash       path_beg /api/cash/
    acl is_clients    path_beg /api/clients
    acl is_billing    path_beg /api/billing/
    acl is_mapreduce  path_beg /api/mapreduce/

    # ── Validación del JWT (todas las rutas /api excepto el login) ──
    http-request set-var(txn.bearer) http_auth_bearer if is_api !is_login
    http-request return status 401 content-type application/json string '{"detail":"Falta el token de acceso"}' if is_api !is_login !{ var(txn.bearer) -m found }
    http-request set-var(txn.jwt_alg) var(txn.bearer),jwt_header_query('$.alg') if is_api !is_login
    http-request return status 401 content-type application/json string '{"detail":"Algoritmo de token no permitido"}' if is_api !is_login !{ var(txn.jwt_alg) -m str HS256 }
    http-request return status 401 content-type application/json string '{"detail":"Token invalido"}' if is_api !is_login !{ var(txn.bearer),jwt_verify(txn.jwt_alg,"${JWT_SECRET}") -m int 1 }
    http-request set-var(txn.exp) var(txn.bearer),jwt_payload_query('$.exp','int') if is_api !is_login
    http-request set-var(txn.now) date() if is_api !is_login
    http-request return status 401 content-type application/json string '{"detail":"Token expirado"}' if is_api !is_login { var(txn.exp),sub(txn.now) -m int le 0 }

    # El gateway le pasa a los servicios quién es el usuario (sacado del token ya validado)
    http-request set-header X-User-Id   %[var(txn.bearer),jwt_payload_query('$.sub')]  if is_api !is_login
    http-request set-header X-User-Name %[var(txn.bearer),jwt_payload_query('$.name')] if is_api !is_login
    http-request set-header X-User-Role %[var(txn.bearer),jwt_payload_query('$.role')] if is_api !is_login

    # Rutas /api que no pertenecen a ningún microservicio
    acl known_api path_beg /api/auth/ /api/inventory/ /api/sales /api/cash/ /api/clients /api/billing/ /api/mapreduce/
    http-request return status 404 content-type application/json string '{"detail":"Ruta no encontrada"}' if is_api !known_api

    use_backend be_auth      if is_auth
    use_backend be_inventory if is_inventory
    use_backend be_sales     if is_sales
    use_backend be_cash      if is_cash
    use_backend be_clients   if is_clients
    use_backend be_billing   if is_billing
    use_backend be_mapreduce if is_mapreduce
    default_backend be_frontend                      # todo lo que no es /api: la interfaz web

# ── Backends: una entrada por réplica (server-template + DNS de Swarm) ──
backend be_auth
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server-template auth 5 tasks.auth-users:8000 check inter 3s fall 2 rise 2 resolvers docker init-addr none

backend be_inventory
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server-template inventory 5 tasks.catalog-inventory:8000 check inter 3s fall 2 rise 2 resolvers docker init-addr none

backend be_sales
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server-template sales 5 tasks.pos-sales:8000 check inter 3s fall 2 rise 2 resolvers docker init-addr none

backend be_cash
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server-template cash 5 tasks.cash-expenses:8000 check inter 3s fall 2 rise 2 resolvers docker init-addr none

backend be_clients
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server-template clients 5 tasks.clients-credits:8000 check inter 3s fall 2 rise 2 resolvers docker init-addr none

backend be_billing
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server-template billing 5 tasks.billing-factus:8000 check inter 3s fall 2 rise 2 resolvers docker init-addr none

backend be_mapreduce
    option httpchk GET /health
    http-check expect status 200
    server-template mr 2 tasks.mr-coordinator:8000 check inter 3s fall 2 rise 2 resolvers docker init-addr none

backend be_frontend
    balance roundrobin
    option httpchk GET /
    server-template web 3 tasks.frontend:80 check inter 3s fall 2 rise 2 resolvers docker init-addr none

# ── Estadísticas y métricas para Prometheus ──
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 3s
    http-request use-service prometheus-exporter if { path /metrics }
